<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{%block titulo%}GameHub{%endblock%}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">GameHub</a>
      <div class="d-flex gap-3">
        <a class="nav-link text-white" href="{{ url_for('clientes.listar') }}">Clientes</a>
        <a class="nav-link text-white" href="{{ url_for('clientes.novo') }}">+ Cadastrar Cliente</a>
        <a class="nav-link text-white" href="{{ url_for('jogos.listar') }}">Jogos</a>
        <a class="nav-link text-white" href="{{ url_for('jogos.novo') }}">+ Cadastrar Jogos</a>
      </div>
    </div>
  </nav>
  <!-- fim navbar -->

  <div class="container">

    {%block conteudo%}{%endblock%}

    <footer>
        <div class="rodape bg-dark">
          <h6>Etec Sales Gomes</h6>
          <h6>Anthony Luiz Domingues</h6>
          <h6>Matheus Alves</h6>
          <h6>2°DS</h6>
          <h6>Projeto PW</h6>
        </div>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
