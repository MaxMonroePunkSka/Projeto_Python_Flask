{%extends 'base.html'%}
{%block titulo%}Cadastrar Cliente{%endblock%}
{%block conteudo%}

  <h2>Cadastrar Cliente</h2>

  {%if erro%}
    <div>{{erro}}</div>
  {%endif%}

  <form method="POST" action="{{ url_for('clientes.novo') }}">

    <div class="mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input class="form-control" type="text" name="nome" placeholder="Ex: Nilce">
    </div>

    <div class="mb-3">
      <label class="form-label" for="data-nasc">Data de Nascimento</label>
      <input class="form-control" type="date" name="data-nasc">
    </div>

    <div class="mb-3">
      <label class="form-label" for="apelido">Apelido</label>
      <input class="form-control" type="text" name="apelido">
    </div>

    <div class="mb-3">
      <button class="btn btn-primary" type="submit">Enviar</button>
      <a href="{{ url_for('clientes.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>

{%endblock%}
