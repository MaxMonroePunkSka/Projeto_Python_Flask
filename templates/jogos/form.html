{%extends 'base.html'%}
{%block titulo%}Cadastrar Jogo{%endblock%}
{%block conteudo%}

  <h2>Cadastrar Jogo</h2>

  {%if erro%}
    <div class="erro">{{ erro }}</div>
  {%endif%}

  <form method="POST" action="{{url_for('jogos.novo')}}" class="mt-3">

    <div class="mb-3">
      <label class="form-label" for="titulo">Título do Jogo</label>
      <input class="form-control" type="text" name="titulo" placeholder="Ex: Eurotruck Simulator">
    </div>

    <div class="mb-3">
      <label class="form-label" for="nota01">Nota 1 (0 - 10)</label>
      <input class="form-control mb-3" type="number" name="nota01" min="0" max="10" step="0.1">

      <label class="form-label" for="nota02">Nota 2 (0 - 10)</label>
      <input class="form-control mb-3" type="number" name="nota02" min="0" max="10" step="0.1">

      <label class="form-label" for="nota03">Nota 3 (0 - 10)</label>
      <input class="form-control" type="number" name="nota03" min="0" max="10" step="0.1">
    </div>

    <div class="mb-3">
      <label class="form-label" for="categorial_01">Categoria 1</label>
      <input class="form-control mb-3" type="text" name="categoria01" placeholder="Ex: ação">

      <label class="form-label" for="categorial_02">Categoria 2</label>
      <input class="form-control" type="text" name="categoria02" placeholder="Ex: sobrevivencia">
    </div>

    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-primary" type="submit">Enviar</button>
      <a href="{{url_for('jogos.listar')}}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>

{%endblock%}
