{% extends 'base.html' %}
{% block titulo %}Jogos{% endblock %}
{% block conteudo %}

  <div>
    <h2>Jogos Cadastrados</h2>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titulo</th>
        <th>Nota</th>
        <th>Categorias</th>
        <th>Detalhes</th>
      </tr>
    </thead>
    <tbody>

      {% for j in jogos %}
        <tr>
          <td>{{ j['id'] }}</td>
          <td>{{ j['titulo'] }}</td>
          <td>{{ j['media'] }}</td>
          <td>{{ j['categorias'] }}</td>
          <td>
            <a href="{{ url_for('jogos.detalhes', id=j.id) }}" class="btn btn-secondary btn-sm">Ver</a>
          </td>
        </tr>
      {% endfor %}

    </tbody>
  </table>

{% endblock %}
