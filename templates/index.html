{%extends 'base.html'%}
{%block titulo%}Início{%endblock%}
{% block conteudo %}

  <h2>Bem-vindo ao GameHub</h2>
  <p class="text-muted">Escolha uma opção no menu acima.</p>

  <div class="row mt-4">

    <div class="col-md-6">
      <div class="card text-white bg-black mb-3">
        <div class="card-body">
          <h5 class="card-title">Clientes</h5>
          <p class="card-text display-4">{{ total_clientes }}</p>
          <a href="{{ url_for('clientes.listar') }}" class="btn btn-light btn-sm">Ver lista</a>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card text-white bg-black mb-3">
        <div class="card-body">
          <h5 class="card-title">Jogos</h5>
          <p class="card-text display-4">{{ total_jogos }}</p>
          <a href="{{ url_for('jogos.listar') }}" class="btn btn-light btn-sm">Ver lista</a>
        </div>
      </div>
    </div>

  </div>

{% endblock %}
